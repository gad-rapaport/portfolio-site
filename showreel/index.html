// ───────── math ─────────

// ───────── motion blur ─────────

// ───────── 3D ─────────
const D3 = 1800;

  ['SLOTKEEPER', 'Backend', 30, '→1', 'requests → booking'],
  ['PLANWRIGHT', 'Frontend', 117, ' KB', 'works offline'],
  ['SIGNALPOST', 'DevOps', 0, '', 'redirects followed'],
  ['FIELDLINE', 'Full stack', 409, '', 'never overwrites'],
  ['AIRWISE', 'Integrations', 10, '', 'cities, one request'],

const HS = [480, 330, 410, 280, 370, 300];
const NODES = [

  { label: 'CLAUDE CODE', dx: 560, dy: -250, h: 270 },
  { label: 'GEMINI CLI', dx: -600, dy: 190, h: 170 },
  { label: 'TESTS', dx: 600, dy: 190, h: 210, tests: true },

// ───────── bar 1: the cursor multiplies ─────────

  const env = (g, t, peak, dec, att = 0.002) => { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + att); g.gain.exponentialRampToValueAtTime(0.0001, t + dec); };
  const pan = (v) => { const p = ctx.createStereoPanner(); p.pan.value = v; p.connect(master); return p; };
  const C0 = pan(0);

  function kick(t, amt = 1) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(170, t); o.frequency.exponentialRampToValueAtTime(44, t + 0.11);
    env(g, t, 0.95 * amt, 0.42); o.connect(g); g.connect(C0); o.start(t); o.stop(t + 0.45);
    noise(t, 0.015, (s) => { const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 3000; const g2 = ctx.createGain(); env(g2, t, 0.25 * amt, 0.012); s.connect(f); f.connect(g2); g2.connect(C0); });
  }
  function hat(t, v = 0.12, p = 0.25) {
    noise(t, 0.06, (s) => { const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 8500; const g = ctx.createGain(); env(g, t, v, 0.045); s.connect(f); f.connect(g); g.connect(pan(p)); });
  }
  function clap(t, v = 0.32) {
    for (const d of [0, 0.011, 0.022]) noise(t + d, 0.16, (s) => { const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1700; f.Q.value = 1.2; const g = ctx.createGain(); env(g, t + d, v, d === 0.022 ? 0.16 : 0.03); s.connect(f); f.connect(g); g.connect(C0); });
  }
  function snare(t, v) {
    noise(t, 0.09, (s) => { const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2400; f.Q.value = 0.8; const g = ctx.createGain(); env(g, t, v, 0.08); s.connect(f); f.connect(g); g.connect(C0); });
  }
  function bass(t, freq, dur = 0.22, v = 0.28) {
    const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    o.type = 'sawtooth'; o.frequency.value = freq; f.type = 'lowpass'; f.Q.value = 6;
    f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(140, t + dur);
    env(g, t, v, dur, 0.005); o.connect(f); f.connect(g); g.connect(C0); o.start(t); o.stop(t + dur + 0.02);
  }
  function hit(t, big = false) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(big ? 90 : 75, t); o.frequency.exponentialRampToValueAtTime(32, t + 0.5);
    env(g, t, big ? 0.9 : 0.6, big ? 1.4 : 0.7); o.connect(g); g.connect(C0); o.start(t); o.stop(t + 1.5);
    noise(t, big ? 0.9 : 0.4, (s) => { const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(9000, t); f.frequency.exponentialRampToValueAtTime(200, t + (big ? 0.7 : 0.3)); const g2 = ctx.createGain(); env(g2, t, big ? 0.55 : 0.35, big ? 0.85 : 0.35); s.connect(f); f.connect(g2); g2.connect(C0); });
    [220, 261.6, 329.6, big ? 440 : 392].forEach((fr, i) => {
      const so = ctx.createOscillator(), sf = ctx.createBiquadFilter(), sg = ctx.createGain();
      so.type = 'sawtooth'; so.frequency.value = fr; so.detune.value = (i - 1.5) * 7;
      sf.type = 'lowpass'; sf.frequency.setValueAtTime(3200, t); sf.frequency.exponentialRampToValueAtTime(300, t + 0.35);
      env(sg, t, big ? 0.07 : 0.05, big ? 0.6 : 0.32, 0.004); so.connect(sf); sf.connect(sg); sg.connect(pan((i - 1.5) * 0.4)); so.start(t); so.stop(t + 0.7);
    });
  }
  function riser(t0, t1) {
    noise(t0, t1 - t0, (s) => {
      const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 3;
      f.frequency.setValueAtTime(300, t0); f.frequency.exponentialRampToValueAtTime(9000, t1);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.5, t1 - 0.02); g.gain.linearRampToValueAtTime(0, t1);
      s.connect(f); f.connect(g); g.connect(C0);
    });
    const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(110, t0); o.frequency.exponentialRampToValueAtTime(880, t1);
    f.type = 'lowpass'; f.frequency.setValueAtTime(400, t0); f.frequency.exponentialRampToValueAtTime(6000, t1);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.12, t1 - 0.02); g.gain.linearRampToValueAtTime(0, t1);
    o.connect(f); f.connect(g); g.connect(C0); o.start(t0); o.stop(t1);
    // Snare roll that doubles its rate into the drop.
    for (let t = t0; t < t1 - 0.01; ) { const u = (t - t0) / (t1 - t0); snare(t, 0.06 + 0.22 * u); t += u < 0.5 ? 0.125 : u < 0.875 ? 0.0625 : 0.03125; }
  }

  const ROOT = [55, 55, 43.65, 49, 55, 41.2, 55, 55];
  for (let b = 0; b < 30; b++) {
    const t = b * 0.5, bar = Math.floor(t / 2);
    kick(t, bar === 6 ? 1.1 : 1);
    hat(t + 0.25, 0.1 + (bar >= 6 ? 0.04 : 0));
    if (bar >= 1 && b % 2 === 1 && bar !== 5) clap(t);
    if (bar !== 5) bass(t + 0.25, ROOT[bar] * (bar === 6 && b % 2 ? 2 : 1));
    if (bar >= 6) hat(t + 0.125, 0.05, -0.3), hat(t + 0.375, 0.05, -0.3);
  }
  for (const t of [0, 2, 4, 6, 8, 10, 14]) hit(t, false);
  hit(12, true);
  riser(10, 12);

  const buf = await ctx.startRendering();
  const L = buf.getChannelData(0), R = buf.getChannelData(1), n = L.length;
  const out = new DataView(new ArrayBuffer(44 + n * 4));
  const str = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
  str(0, 'RIFF'); out.setUint32(4, 36 + n * 4, true); str(8, 'WAVE'); str(12, 'fmt ');
  out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 2, true); out.setUint32(24, sr, true);
  out.setUint32(28, sr * 4, true); out.setUint16(32, 4, true); out.setUint16(34, 16, true); str(36, 'data'); out.setUint32(40, n * 4, true);
  let peak = 0;
  for (let i = 0; i < n; i++) peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i]));
  const k = peak > 0.98 ? 0.98 / peak : 1;
  for (let i = 0; i < n; i++) {
    out.setInt16(44 + i * 4, clamp(L[i] * k, -1, 1) * 32767, true);
    out.setInt16(46 + i * 4, clamp(R[i] * k, -1, 1) * 32767, true);
  }
  const bytes = new Uint8Array(out.buffer);
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
};
